[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
# Check https://flit.readthedocs.io/en/latest/pyproject_toml.html for all available sections
name = "ansys-mcp-metapackage"
version = "0.1.dev0"
description = "PyAnsys Model Context Protocol (MCP) metapackage - unified hub for AI-powered ANSYS simulation workflows"
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [{ name = "Synopsys, Inc. and ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
maintainers = [{ name = "Synopsys, Inc. and ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "toml>=0.10.2",
    "ansys-mapdl-mcp==0.2.1",
    # "ansys-fluent-mcp==0.1.0",  # TODO: only compatible with Python 3.13
    "ansys-mechanical-mcp==0.1.0",
    "ansys-aedt-mcp==0.1.0",
    "ansys-lumerical-mcp==0.1.0",
]

[project.optional-dependencies]
[project.urls]
Source = "https://github.com/ansys/pyansys-mcp"
Documentation = "TODO"
[dependency-groups]
doc = [
    "ansys-sphinx-theme==1.9.0",
    "Jinja2>=3.1.6",
    "Pillow>=12.2.0",
    "PyGithub>=2.9.1",
    "sphinx-autobuild>=2025.08.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-mermaid>=2.0.2",
    "sphinx-jinja>=2.0.2",
    "toml==0.10.2",
]

[tool.ruff]
line-length = 100
fix = true

[tool.flit.module]
name = "ansys.mcp.metapackage"

[tool.flit.sdist]
include = ["src/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "F",    # pyflakes, see https://docs.astral.sh/ruff/rules/#pyflakes-f
    "I",    # isort, see https://docs.astral.sh/ruff/rules/#isort-i
    "N",    # pep8-naming, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PTH",  # flake8-use-pathlib, https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TD",   # flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
]
ignore = [
    "TD002", # Missing author in TODOs comment
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

