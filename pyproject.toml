[build-system]
build-backend = "flit_core.buildapi"
requires = [ "flit-core>=3.2,<5" ]

[project]
# Check https://flit.readthedocs.io/en/latest/pyproject_toml.html for all available sections
name = "pyansys-mcp"
version = "0.1.dev0"
description = "PyAnsys Model Context Protocol (MCP) metapackage - unified hub for AI-powered Ansys simulation workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Synopsys, Inc. and ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
authors = [ { name = "Synopsys, Inc. and ANSYS, Inc.", email = "pyansys-core@synopsys.com" } ]
requires-python = ">=3.12,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "ansys-aedt-mcp==0.2.1",
  "ansys-fluent-mcp==0.4.0",
  "ansys-lumerical-mcp==0.1.0",
  "ansys-mapdl-mcp==0.3.0",
  "ansys-mechanical-mcp==0.2.1",
]
optional-dependencies = {}
urls.Discussions = "https://github.com/ansys/pyansys-mcp/discussions"
urls.Documentation = "https://mcp.docs.pyansys.com"
urls.Issues = "https://github.com/ansys/pyansys-mcp/issues"
urls.Releases = "https://github.com/ansys/pyansys-mcp/releases"
urls.Source = "https://github.com/ansys/pyansys-mcp"

[dependency-groups]
doc = [
  "ansys-sphinx-theme==1.11.0",
  "jinja2>=3.1.6",
  "pillow>=12.2.0",
  "pygithub>=2.9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinx-jinja>=2.0.2",
  "sphinxcontrib-mermaid>=2.0.2",
  "toml==0.10.2",
]

[tool.flit]
module.name = "pyansys.mcp"
sdist.include = [ "src/" ]

[tool.ruff]
line-length = 100
fix = true
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "TD",  # flake8-todos
]
lint.isort.combine-as-imports = true
lint.isort.force-sort-within-sections = true
lint.pydocstyle.convention = "numpy"
