# Pre-commit hooks for code quality
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  # Add copyright statement to files
  - repo: https://github.com/ansys/pre-commit-hooks
    rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
    hooks:
    - id: add-license-headers
      args:
      - --start_year=2026
      - --custom_license=Apache-2.0

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Spell checking with typos
  - repo: https://github.com/crate-ci/typos
    rev: c132f8b9e3ac7f8f0625490b1cb5b906d1d6a63a  # frozen: v1
    hooks:
      - id: typos
        args: ["--config", "doc/styles/typos.toml"]
        exclude: "(^doc/styles/config/vocabularies)|(^.github/labels.yml$)"

  # Format pyproject.toml files
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 3b42b9776870badc9eaffdef9a4a0834b764d87c  # frozen: v2.29.3
    hooks:
      - id: pyproject-fmt
        args: [--keep-full-version]

  # Validates GitHub workflow files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: c4654a7e007c9619a5eb63c39a456572a0fa1851  # frozen: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
