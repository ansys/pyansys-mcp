# Pre-commit hooks for code quality
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Linting and formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  # Add copyright statement to files
  - repo: https://github.com/ansys/pre-commit-hooks
    rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
    hooks:
    - id: add-license-headers
      args:
      - --start_year=2026
      - --custom_license=Apache-2.0

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Spell checking with typos
  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85  # frozen: v1.52.0
    hooks:
      - id: typos
        args: ["--config", "doc/styles/typos.toml"]
        exclude: "(^doc/styles/config/vocabularies)|(^.github/labels.yml$)"

  # TODO: Re-enable pyproject.toml formatting once Python 3.15 is fully supported
  # # Format pyproject.toml files
  # - repo: https://github.com/tox-dev/pyproject-fmt
  #   rev: 3c6e76e10abcae02303212289efed3413350769c  # frozen: v2.30.6
  #   hooks:
  #     - id: pyproject-fmt
  #       args: [--keep-full-version]

  # Validates GitHub workflow files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
